apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - networkpolicy.yaml
  - cronjob.yaml
  - mlflow.yaml
  - stream-consumer.yaml

# Genera el ConfigMap con un sufijo hash derivado de su contenido: cualquier
# cambio en estos valores produce un nombre nuevo, lo que fuerza un rollout
# del Deployment/CronJob automáticamente (Kustomize actualiza las
# referencias `envFrom.configMapRef.name` en todos los manifiestos por
# nosotros -- sin `sed`, sin editar YAML a mano).
configMapGenerator:
  - name: dlinear-config
    literals:
      - MLFLOW_TRACKING_URI=http://mlflow.dlinear-production.svc.cluster.local:5000
      - MODEL_NAME=dlinear-ett-forecaster
      - MODEL_ALIAS=production
      - BATCH_INPUT_KEY=batch/input_data.csv
      - BATCH_OUTPUT_KEY=batch/predictions_output.csv
      - KAFKA_BOOTSTRAP_SERVERS=kafka.dlinear-production.svc.cluster.local:9092
      # core_ml/src/monitoring/stream_consumer.py -- nombre determinístico
      # (terraform/kinesis.tf: "${project_name}-sensor-telemetry"), no
      # depende de ningún output post-apply como RDS_ENDPOINT sí.
      - SENSOR_STREAM_NAME=dlinear-forecast-cluster-sensor-telemetry
      # core_ml/src/monitoring/mitigation.py -- API de Pipeline Trigger de
      # GitLab. GITLAB_TRIGGER_TOKEN es la mitad sensible, entregada vía el
      # Secret gitlab-trigger-credentials (kubernetes/base/stream-consumer.yaml).
      - GITLAB_API_URL=https://gitlab.com/api/v4
      - GITLAB_PROJECT_PATH=personal-group7745334/612-forecasting-oil-temperature-mlops
      - GITLAB_REF=main
