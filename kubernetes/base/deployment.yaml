apiVersion: apps/v1
kind: Deployment
metadata:
  name: dlinear-api
  labels:
    app: dlinear-forecast
spec:
  # Sin `replicas`: el HPA (hpa.yaml, minReplicas: 3) es el dueño del
  # número de réplicas. Declararlo aquí haría que cada `kubectl apply -k`
  # lo resetee, pisando la escala que el HPA haya decidido.
  selector:
    matchLabels:
      app: dlinear-forecast
  template:
    metadata:
      labels:
        app: dlinear-forecast
    spec:
      serviceAccountName: dlinear-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001  # mismo UID que crea el Dockerfile
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: dlinear-container
        # Nombre lógico: el overlay de cada entorno lo remapea al registro/
        # tag reales vía el transformer `images:` de Kustomize (nunca con
        # `sed` ni `kubectl set image` -- ver kubernetes/overlays/production).
        image: dlinear-api:base
        ports:
        - containerPort: 8000
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]

        # El lifespan de la API carga el modelo (con reintentos y backoff)
        # ANTES de empezar a responder: durante ese tiempo /health no
        # contesta. El startupProbe da hasta ~2 min de margen y deja en
        # pausa al livenessProbe, que así no reinicia un pod que solo está
        # arrancando.
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 5
          failureThreshold: 24
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 20
        readinessProbe:
          # Distinto de /health: solo pasa si el modelo terminó de cargar
          # (ver api/main.py::readiness_check) -- así el Service no le manda
          # tráfico a un pod vivo pero todavía sin modelo en memoria.
          httpGet:
            path: /ready
            port: 8000
          periodSeconds: 10

        resources:
          # PyTorch + MLflow + pandas cargados en memoria ya rondan los
          # 400-500Mi: con un límite de 512Mi el pod quedaba al borde del
          # OOMKill en cuanto llegaba tráfico.
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

        # Toda la configuración no sensible vive en el ConfigMap (declarativo,
        # generado por Kustomize) en vez de estar embebida aquí por servicio.
        envFrom:
        - configMapRef:
            name: dlinear-config
