apiVersion: v1
kind: ServiceAccount
metadata:
  name: dlinear-sa
  annotations:
    # Placeholder: el overlay de cada entorno lo sobreescribe con el ARN
    # real (ver kubernetes/overlays/production/serviceaccount-patch.yaml).
    # El Account ID es el único valor que de verdad requiere una edición
    # manual, una vez por entorno -- no cambia en cada despliegue como el
    # tag de imagen, que sí se automatiza vía CI (ver .gitlab-ci.yml).
    eks.amazonaws.com/role-arn: "arn:aws:iam::REPLACE_WITH_AWS_ACCOUNT_ID:role/dlinear-api-s3-read-role"
