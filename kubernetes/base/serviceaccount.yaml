# ServiceAccount plano, sin anotaciones IRSA: el permiso de S3 lo otorga el
# rol de IAM del node group de EKS (ver terraform/eks.tf), así que cualquier
# Pod del cluster hereda el permiso del nodo donde corre en vez de un rol de
# IAM propio por workload.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dlinear-sa
