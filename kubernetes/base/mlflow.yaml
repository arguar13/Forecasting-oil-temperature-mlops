# MLflow Tracking Server + Model Registry para producción.
#
# Imagen oficial (ghcr.io/mlflow/mlflow) directamente, sin Dockerfile propio
# ni repositorio en ECR -- una imagen menos que construir y publicar. La
# imagen oficial no trae el driver de Postgres, así que el comando instala
# psycopg2-binary al arrancar el contenedor, antes de levantar el server.
#
# Credenciales de la base de datos: NO se comitean a Git. El Secret
# `mlflow-db-credentials` que este Deployment referencia se crea de forma
# imperativa, una sola vez por cluster -- un Secret plano de Kubernetes:
#
#   kubectl create namespace dlinear-production --dry-run=client -o yaml | kubectl apply -f -
#   kubectl create secret generic mlflow-db-credentials \
#     --namespace dlinear-production \
#     --from-literal=username=<mismo usuario que var.db_username en terraform> \
#     --from-literal=password=<la misma contraseña usada en var.db_password>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      serviceAccountName: dlinear-sa
      containers:
        - name: mlflow-container
          image: ghcr.io/mlflow/mlflow:v2.16.0
          command:
            - sh
            - -c
            - >-
              pip install --no-cache-dir psycopg2-binary==2.9.9 &&
              exec mlflow server
              --backend-store-uri postgresql://$(MLFLOW_DB_USERNAME):$(MLFLOW_DB_PASSWORD)@$(RDS_ENDPOINT)/mlflow_db
              --default-artifact-root s3://$(MODEL_BUCKET_NAME)/mlflow
              --host 0.0.0.0
              --port 5000
          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: dlinear-config
          env:
            - name: MLFLOW_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mlflow-db-credentials
                  key: username
            - name: MLFLOW_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-db-credentials
                  key: password

          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  # Nombre exacto que MLFLOW_TRACKING_URI espera resolver vía DNS interno
  # del cluster: mlflow.<namespace>.svc.cluster.local.
  name: mlflow
spec:
  selector:
    app: mlflow
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP
