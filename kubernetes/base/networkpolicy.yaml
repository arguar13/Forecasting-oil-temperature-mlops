# NetworkPolicy por workload: sin ninguna, cualquier pod de
# dlinear-production puede hablarle a cualquier otro sin restricción -- un
# pod de la API comprometido podría alcanzar mlflow (y por extensión RDS/S3)
# igual de fácil que un cliente legítimo. namespace: dlinear-production
# (declarado en kubernetes/overlays/production/kustomization.yaml) alcanza
# a los tres recursos de abajo sin necesidad de metadata.namespace explícito
# en cada uno: Deployment/CronJob/NetworkPolicy son tipos que Kustomize
# reconoce como namespaced, a diferencia de un CRD cluster-scoped (no hay
# ninguno en este repo).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dlinear-forecast-network-policy
spec:
  podSelector:
    matchLabels:
      app: dlinear-forecast
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Pública por diseño (Service dlinear-service, NLB) - la superficie que
    # importa restringir aquí es el puerto, no el origen.
    - ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: mlflow
      ports:
        - protocol: TCP
          port: 5000
    # APIs de AWS (S3 para artefactos, STS para IRSA). Los rangos de IP de
    # los endpoints de AWS son dinámicos y gestionados por AWS, no algo
    # fijable en un CIDR estable aquí - restringir por puerto (solo 443) es
    # la superficie que un NetworkPolicy puede cubrir de forma portable;
    # IAM y Security Groups ya cubren el resto.
    - ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mlflow-network-policy
spec:
  podSelector:
    matchLabels:
      app: mlflow
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # mlflow es ClusterIP interno (nunca expuesto directo a internet en
    # este proyecto): solo pods del propio namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dlinear-production
      ports:
        - protocol: TCP
          port: 5000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # RDS (backend store) + APIs de AWS (S3, artifact root). Mismo
    # razonamiento que en dlinear-forecast-network-policy sobre por qué 443
    # va sin CIDR.
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
---
# dlinear-batch (CronJob de batch inference): nunca escucha nada -- no
# tiene readiness/liveness ni sirve tráfico -- así que niega TODO ingress
# (sin reglas bajo `ingress:`) y solo abre el egress que de verdad usa:
# DNS, mlflow (carga del modelo), y AWS (S3 para input/output del batch,
# CloudWatch para el heartbeat de terraform/alarms.tf, STS para IRSA).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dlinear-batch-network-policy
spec:
  podSelector:
    matchLabels:
      app: dlinear-batch
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: mlflow
      ports:
        - protocol: TCP
          port: 5000
    - ports:
        - protocol: TCP
          port: 443
---
# stream-consumer: como dlinear-batch, nunca sirve tráfico entrante (el
# liveness probe es un `exec` local, no un puerto HTTP) -- niega TODO
# ingress. Egress añade el puerto de RDS (drift_store.py: un segundo
# schema en la misma base que usa mlflow) sobre el patrón ya establecido en
# dlinear-batch-network-policy; el 443 sin restricción de IP ya cubre tanto
# Kinesis (AWS) como la API de Pipeline Trigger de GitLab
# (mitigation.py) -- ninguno de los dos tiene un rango de IP estable
# fijable en un CIDR aquí.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stream-consumer-network-policy
spec:
  podSelector:
    matchLabels:
      app: stream-consumer
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: mlflow
      ports:
        - protocol: TCP
          port: 5000
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
