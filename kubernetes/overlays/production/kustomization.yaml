apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dlinear-production

resources:
- ../../base

# Extiende (no reemplaza) el ConfigMap base con los valores específicos de
# este entorno: el bucket S3 determinístico (ver
# terraform/s3.tf::model_artifacts_bucket_name) y el endpoint de RDS que usa
# el Deployment de MLflow (kubernetes/base/mlflow.yaml) para su
# --backend-store-uri -- ver `terraform output rds_endpoint`. Ninguno de los
# dos es secreto (la contraseña de RDS vive en el Secret imperativo
# `mlflow-db-credentials`, fuera de Kustomize/Git -- ver mlflow.yaml).
configMapGenerator:
- behavior: merge
  literals:
  - MODEL_BUCKET_NAME=dlinear-forecast-cluster-model-artifacts-040175285118
  - RDS_ENDPOINT=dlinear-forecast-cluster-backend-db.cctqc6mqgk83.us-east-1.rds.amazonaws.com:5432
  name: dlinear-config

# El ÚNICO punto que cambia en cada despliegue. CI lo actualiza de forma
# estructural con `kustomize edit set image` (nunca sed, nunca
# `kubectl set image`) justo antes de `kubectl apply -k` -- ver
# .gitlab-ci.yml::deploy.
images:
- name: dlinear-api
  newName: 040175285118.dkr.ecr.us-east-1.amazonaws.com/dlinear-forecast-api
  newTag: 33b7dea0936f5443fdcacc14de314ff4c94e2a39
