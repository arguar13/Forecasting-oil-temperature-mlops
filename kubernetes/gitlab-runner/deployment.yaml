# GitLab Runner self-hosted, corriendo DENTRO del propio cluster EKS.
#
# Por qué existe: `train_model` y `quality_gate` (.gitlab-ci.yml) necesitan
# hablarle al MLflow Tracking Server interno
# (http://mlflow.dlinear-production.svc.cluster.local:5000, ver
# kubernetes/base/mlflow.yaml) -- un Service ClusterIP, solo resoluble
# DENTRO del cluster. Los runners compartidos de GitLab.com corren fuera de
# esta VPC y no pueden alcanzarlo.
#
# Por qué esta solución y no otras: exponer MLflow con un Load Balancer
# público (o abrir el Security Group de RDS) rompe el modelo de red
# zero-trust que el resto de este proyecto sostiene (ver README, sección
# "Security Model"), y un bastion/VPN dedicado tiene costo fijo propio. Un
# único pod de gitlab-runner reutiliza la capacidad YA aprovisionada del
# node group de EKS (terraform/eks.tf) -- sin levantar ningún recurso nuevo
# de AWS, solo un Deployment más en un cluster que ya existe. Es la opción
# más barata que no debilita el aislamiento de red existente.
#
# Solo los jobs con `tags: [in-vpc]` en .gitlab-ci.yml corren aquí; el resto
# del pipeline (quality, terraform, docker build, kubernetes:deploy) sigue
# usando los runners compartidos gratuitos de GitLab.com sin cambios.
#
# Bootstrap (una sola vez, fuera de Git -- igual que mlflow-db-credentials):
#   1. GitLab > (Project o Group) Settings > CI/CD > Runners > "New runner"
#      -> tags: in-vpc -> copiar el authentication token (glrt-...).
#   2. kubectl create secret generic gitlab-runner-token \
#        --namespace gitlab-runner \
#        --from-literal=runner-token=<glrt-...>
#   3. kubectl apply -k kubernetes/gitlab-runner/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-runner
  labels:
    app: gitlab-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab-runner
  template:
    metadata:
      labels:
        app: gitlab-runner
    spec:
      serviceAccountName: gitlab-runner
      # El init container registra el runner UNA vez por arranque de pod y
      # escribe el config.toml resultante (incluye el token, por eso vive
      # en un emptyDir efímero, nunca en un ConfigMap ni en Git) en un
      # volumen compartido con el contenedor principal.
      initContainers:
        - name: register
          image: gitlab/gitlab-runner:v16.11.2
          command:
            - /bin/sh
            - -c
            - |
              gitlab-runner register \
                --non-interactive \
                --url "https://gitlab.com" \
                --token "$(RUNNER_TOKEN)" \
                --executor "kubernetes" \
                --kubernetes-namespace "gitlab-runner" \
                --kubernetes-service-account "gitlab-runner" \
                --kubernetes-image "python:3.10" \
                --kubernetes-pod-labels "app=gitlab-runner-job" \
                --tag-list "in-vpc" \
                --run-untagged="false" \
                --config /etc/gitlab-runner/config.toml
          env:
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitlab-runner-token
                  key: runner-token
          volumeMounts:
            - name: runner-config
              mountPath: /etc/gitlab-runner
      containers:
        - name: gitlab-runner
          image: gitlab/gitlab-runner:v16.11.2
          command:
            - gitlab-runner
            - run
            - --working-directory
            - /etc/gitlab-runner
            - --config
            - /etc/gitlab-runner/config.toml
          volumeMounts:
            - name: runner-config
              mountPath: /etc/gitlab-runner
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: runner-config
          emptyDir: {}
