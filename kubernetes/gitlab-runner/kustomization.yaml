apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Tooling de plataforma, no parte de la app -- se aplica una sola vez de
# forma imperativa (igual que el bootstrap de ArgoCD), no vía la Application
# de GitOps que reconcilia kubernetes/overlays/production/.
resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
