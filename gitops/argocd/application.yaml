# Aplica UNA sola vez, manualmente, contra el cluster donde corre ArgoCD
# (bootstrap; ver gitops/argocd/README.md):
#
#   kubectl apply -f gitops/argocd/application.yaml
#
# A partir de ahí, este Application ES el estado deseado: ArgoCD reconcilia
# continuamente el cluster contra kubernetes/overlays/production/ en este
# repo. Nada más vuelve a tocar el cluster de forma imperativa -- ni un
# `kubectl apply` manual, ni un `kubectl set image` desde CI (ver
# .gitlab-ci.yml::kubernetes:deploy, que ahora solo comitea un cambio en
# Git; ArgoCD hace el resto).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dlinear-forecast-api
  namespace: argocd
  finalizers:
    # Si se borra este Application, ArgoCD borra también los recursos que
    # gestiona en el cluster -- evita namespaces/objetos huérfanos.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # Reemplazar por la URL real del repo (GitLab u otro remoto) al hacer
    # el bootstrap del entorno.
    repoURL: https://gitlab.com/personal-group7745334/612-forecasting-oil-temperature-mlops.git
    targetRevision: main
    path: kubernetes/overlays/production

  destination:
    server: https://kubernetes.default.svc
    namespace: dlinear-production

  syncPolicy:
    automated:
      # Cualquier objeto en el cluster que ya no esté declarado en Git se
      # elimina (prune) y cualquier drift manual se revierte (selfHeal) --
      # el cluster nunca puede divergir de lo que dice el repo por mucho
      # tiempo, sin importar quién o qué lo haya tocado.
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
