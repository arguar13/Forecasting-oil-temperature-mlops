[tool.poetry]
name = "dlinear-mlops-core"
version = "1.0.0"
description = "Pipeline de Entrenamiento, Datos y Tracking MLOps"
authors = ["Armando <armandoguarnera1322@gmail.com>"]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
# Data Engineering & Tracking
pandas = "^2.2.0"
boto3 = "^1.34.0"
psycopg2-binary = "^2.9.9" # Conexión MLflow a PostgreSQL
mlflow = "^2.16.0"
# DVC integrado correctamente
dvc = {extras = ["s3"], version = "^3.55.0"}
# CPU-only: el wheel estándar de PyPI empaqueta el runtime CUDA completo
# (nvidia-cublas/cudnn/cusolver/... , varios GB) aunque nunca se ejecuta --
# ningún nodo en este proyecto tiene GPU (EKS: t3.large: ver
# terraform/eks.tf; runners de CI; entrenamiento local en
# core_ml/train.Dockerfile) y el código ya hace fallback explícito
# (train.py: `torch.device("cuda" if torch.cuda.is_available() else
# "cpu")`). Ese peso muerto infló la imagen de la API a ~8.26GB, causando
# timeouts reales de red en el push a ECR ("use of closed network
# connection" tras >19 min subiendo una sola capa, verificado en un run
# real del pipeline) y contribuyendo al DiskPressure de los nodos.
torch = {version = "^2.3.0", source = "pytorch-cpu"}

# Machine Learning & Optimization
scikit-learn = "^1.5.0"
joblib = "^1.4.2"
optuna = "^3.6.0"

# Dependencias base
pydantic = "^2.9.0"
numpy = ">=1.26.0,<3.0.0"
pyyaml = "^6.0.2"
# core_ml/src/monitoring/mitigation.py -- llamada acotada (timeout, sin
# reintento) a la API de Pipeline Trigger de GitLab.
requests = "^2.32.0"

# Eventos (Fase 3: notifica finalización de batch inference vía Kafka)
kafka-python = "^3.0.11"

# Observabilidad y resiliencia (Fase 4)
structlog = "^26.1.0"
tenacity = "^9.1.4"
pybreaker = "^1.4.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
mypy = "^1.11.0"
ruff = "^0.6.9"
black = "^24.8.0"
isort = "^5.13.2"
bandit = {extras = ["toml"], version = "^1.7.9"}
boto3-stubs = {extras = ["s3"], version = "^1.34.0"}
pandas-stubs = "^2.2.0"
types-pyyaml = "^6.0.12"
# Fase 3: integración local con contenedores efímeros (Postgres, Kafka,
# LocalStack) y orquestación de docker-compose.yml desde los tests.
testcontainers = "^4.15.0"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------
# Herramientas de calidad (Fase 1: Local Quality)
# ---------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "C4"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src"]

[tool.mypy]
# NOTA: 3.12, no 3.10. El runtime productivo del pipeline sigue fijado por
# `python = "^3.10"` en las dependencias; esto solo controla qué sintaxis
# puede asumir mypy al analizar. Con 3.10, el stub de numpy>=2.5 (que usa
# `type X = ...`, PEP 695) hace fallar el parseo con "Type statement is only
# supported in Python 3.12 and greater", un falso positivo del propio stub
# de numpy, no de nuestro código. Ruff (target-version=py310) sigue siendo
# la red de seguridad contra sintaxis incompatible con 3.10.
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/"]

# `ignore_missing_imports` global no siempre silencia el diagnóstico
# `import-untyped` (paquete instalado pero sin stubs). `types-pyyaml` ya está
# declarado como dev-dependency; este override es la red de seguridad
# mientras el lockfile no se haya podido regenerar (p. ej. sin red).
[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "data"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
# Los tests marcados `integration` (Testcontainers: Postgres/Kafka/LocalStack
# efímeros, docker-compose.yml completo) requieren Docker corriendo y son
# lentos -- se excluyen del `make test`/pre-commit por defecto. Se corren
# explícitamente con `make test-integration` (-m integration).
addopts = "-ra -q -m 'not integration' --cov=src --cov-report=term-missing"
markers = [
    "integration: requiere Docker (Testcontainers); no corre en pre-commit/make test por defecto",
]
