[tool.poetry]
name = "dlinear-mlops-api"
version = "1.0.0"
description = "Microservicio de Inferencia para Time Series Forecasting"
authors = ["Armando <armandoguarnera1322@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
# CPU-only: ver la nota equivalente en core_ml/pyproject.toml -- ningún nodo
# de este proyecto tiene GPU, el wheel estándar de PyPI infló esta imagen a
# ~8.26GB (verificado: aws ecr describe-images) y eso causó timeouts reales
# de red en el push a ECR ("use of closed network connection" tras >19 min
# subiendo una sola capa).
torch = {version = "^2.3.0", source = "pytorch-cpu"}
mlflow = "^2.16.0"
pydantic = "^2.9.0"
numpy = ">=1.26.0,<3.0.0"
pandas = "^2.2.0"
joblib = "^1.4.2"
boto3 = "^1.34.0"
scikit-learn = "^1.5.0"
# No lo usa api/main.py directamente, pero la misma imagen sirve como
# entrypoint del CronJob de batch inference (core_ml/src/batch_inference.py
# -> events.py), que sí lo necesita para publicar eventos en Kafka.
kafka-python = "^3.0.11"

# Observabilidad y resiliencia (Fase 4)
structlog = "^26.1.0"
tenacity = "^9.1.4"
pybreaker = "^1.4.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
mypy = "^1.11.0"
ruff = "^0.6.9"
black = "^24.8.0"
isort = "^5.13.2"
bandit = {extras = ["toml"], version = "^1.7.9"}
boto3-stubs = {extras = ["s3"], version = "^1.34.0"}
pandas-stubs = "^2.2.0"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------
# Herramientas de calidad (Fase 1: Local Quality)
# ---------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "C4"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["api"]

[tool.mypy]
# NOTA: 3.12, no 3.10. El runtime productivo sigue fijado a Python 3.10 vía
# Dockerfile (python:3.10-slim) y `python = "^3.10"` en las dependencias;
# esto solo controla qué sintaxis puede asumir mypy al analizar. Con 3.10,
# el stub de numpy>=2.5 (que usa `type X = ...`, PEP 695) hace fallar el
# parseo con "Type statement is only supported in Python 3.12 and greater",
# un falso positivo del propio stub de numpy, no de nuestro código. Ruff
# (target-version=py310) y la ejecución real en la imagen 3.10 durante CI
# siguen siendo la red de seguridad contra sintaxis incompatible con 3.10.
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".."]
addopts = "-ra -q --cov=api --cov-report=term-missing"
