# ==============================================================================
# Fase 3: Entorno Local, Contenedores y Simulación de Nube.
#
# Replica el ecosistema completo de AWS localmente, sin costo ni credenciales
# reales: LocalStack simula S3/SQS/Secrets Manager/Kinesis ("la falsa nube"),
# Postgres simula RDS, y Kafka + MLflow + la API corren como en producción. Todos los
# componentes se validan aquí -- con `docker-compose up` y con los tests de
# Testcontainers en `core_ml/tests/integration/` -- antes de tocar AWS real.
# ==============================================================================

services:
  # Base de datos local (Simula AWS RDS Postgres)
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: mlflow_db
      POSTGRES_USER: mlopsadmin
      POSTGRES_PASSWORD: localpassword123  # pragma: allowlist secret -- credencial fija solo para el stack local emulado, nunca se usa fuera de docker-compose
    ports:
      - "5432:5432"
    # Desde Postgres 18, la imagen oficial espera el volumen montado en
    # /var/lib/postgresql (no en .../data): guarda los datos en una
    # subcarpeta versionada (.../18/docker) para que pg_upgrade --link
    # pueda migrar entre major versions sin copiar todo el volumen. Montar
    # en .../data (convención pre-18) hace que el contenedor se niegue a
    # arrancar ("invalid volume mount").
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlopsadmin -d mlflow_db"]
      interval: 5s
      timeout: 5s
      # 20, no 10: integration_tests (.gitlab-ci.yml) corre este mismo
      # docker-compose.yml dentro de Docker-in-Docker anidado, en un host
      # compartido con otros proyectos -- bajo esa contención, "healthy"
      # tarda más que en un `make up` local sin carga. Más reintentos no
      # cuesta nada en el camino feliz (Docker deja de sondear en cuanto
      # el servicio da healthy), solo da margen real cuando el host está
      # ocupado. Verificado: test_docker_compose_stack.py fallando por
      # agotar el presupuesto de espera, no por un servicio realmente roto.
      retries: 20

  # "La falsa nube": simula S3 (artefactos de modelo + datos DVC), SQS,
  # Secrets Manager (credenciales) y CloudWatch (heartbeat del CronJob de
  # batch inference, ver terraform/alarms.tf), todo en un único contenedor.
  # La app y los tests de integración le apuntan a esto en vez de a AWS
  # real -- mismo API, cero costo, cero riesgo.
  localstack:
    # Pineado a la última tag Community (SemVer) pre-unificación: desde
    # marzo 2026 LocalStack fusionó Community+Pro en una imagen "LocalStack
    # for AWS" (tags calendario, p. ej. 2026.08.0) que exige un Auth Token
    # de cuenta -- rompe la premisa de "cero costo, cero credenciales
    # reales" de esta fase. Verificado: 4.14.0 corre S3/SQS/SecretsManager
    # sin login, edition "community".
    image: localstack/localstack:4.14.0
    environment:
      # cloudwatch: heartbeat de batch_inference.py (dead man's switch, ver
      # terraform/alarms.tf) -- sin esto, _publish_heartbeat falla en local
      # (best-effort, no tumba el batch, pero deja un warning permanente
      # en los logs por algo que sí está soportado en LocalStack Community).
      # kinesis: scripts/sensor_simulator.py y
      # core_ml/src/monitoring/stream_consumer.py -- sin esto, la única
      # forma de probar el código de streaming sería contra el Kinesis
      # real de terraform/kinesis.tf, exactamente lo que este stack local
      # existe para evitar.
      SERVICES: s3,sqs,secretsmanager,cloudwatch,kinesis
      DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test  # pragma: allowlist secret -- credencial fija de LocalStack, nunca se usa fuera del stack local
      PERSISTENCE: 1
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      # Scripts que corren automáticamente cuando LocalStack está listo:
      # crean el bucket S3, la cola SQS y el secreto -- ver localstack/init/.
      - ./localstack/init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      # 25, ver la nota equivalente en postgres.healthcheck.
      retries: 25

  # Broker de eventos (KRaft, sin ZooKeeper). Hoy publica eventos de
  # finalización del batch scoring (ver core_ml/src/events.py); queda
  # disponible para futura ingesta/streaming.
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      # 40 (~6.7min), ver la nota en postgres.healthcheck -- este y los dos
      # de abajo (mlflow, api) son los más lentos en arrancar bajo carga,
      # así que llevan el mayor margen.
      retries: 40

  # Crea el topic con partitions/replication explícitos (determinismo, en vez
  # de depender del auto-create) y termina -- no es un servicio de larga vida.
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
      --create --if-not-exists --topic batch-inference-events
      --partitions 1 --replication-factor 1"
    restart: "no"

  # Servidor de tracking
  mlflow:
    # La imagen oficial no trae driver de Postgres (ver mlflow.Dockerfile).
    build:
      context: .
      dockerfile: mlflow.Dockerfile
    command: mlflow server --backend-store-uri postgresql://mlopsadmin:localpassword123@postgres/mlflow_db --default-artifact-root s3://mlops-portafolio-proj3-models/mlflow --host 0.0.0.0  # pragma: allowlist secret -- credencial fija solo para el stack local emulado
    ports:
      - "5000:5000"
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test  # pragma: allowlist secret -- credencial fija de LocalStack, nunca se usa fuera del stack local
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_ENDPOINT_URL: http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000')"]
      interval: 10s
      timeout: 5s
      # 40 (~6.7min), ver la nota en kafka.healthcheck.
      retries: 40
      start_period: 15s

  # API Inferencia Local (Tu contenedor de FastAPI)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # El modelo se resuelve por nombre+alias contra el MLflow Model
      # Registry (ver api/main.py), no contra un bucket/ruta S3 fija.
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: dlinear-ett-forecaster
      MODEL_ALIAS: production
      # MLflow descarga el artefacto del modelo desde LocalStack (backend S3
      # del tracking server) usando estas credenciales.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test  # pragma: allowlist secret -- credencial fija de LocalStack, nunca se usa fuera del stack local
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_ENDPOINT_URL: http://localstack:4566
    depends_on:
      mlflow:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      # 40 (~6.7min), ver la nota en kafka.healthcheck.
      retries: 40
      start_period: 20s

  # Consumidor de Kinesis (core_ml/src/monitoring/stream_consumer.py):
  # inferencia online a 1 hora vista + detección de drift por CUSUM. Perfil
  # "tools" (no arranca con `make up`) -- es un proceso de larga duración
  # cuyo sentido depende de que algo esté publicando lecturas primero, así
  # que se levanta a demanda: `make stream-local` (ver Makefile) orquesta
  # crear el stream, este servicio, y el simulador en la secuencia correcta.
  stream-consumer:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m src.monitoring.stream_consumer
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: dlinear-ett-forecaster
      MODEL_ALIAS: production
      SENSOR_STREAM_NAME: sensor-telemetry-local
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test  # pragma: allowlist secret -- credencial fija de LocalStack, nunca se usa fuera del stack local
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      MLFLOW_S3_ENDPOINT_URL: http://localstack:4566
      # drift_store.py / mitigation.py: mismo Postgres que ya usa mlflow,
      # segundo schema. RDS_ENDPOINT reutiliza el formato host:port real
      # (ver kubernetes/base/mlflow.yaml) aunque aquí "RDS" sea el propio
      # servicio postgres de este stack.
      RDS_ENDPOINT: postgres:5432
      MLFLOW_DB_USERNAME: mlopsadmin
      MLFLOW_DB_PASSWORD: localpassword123  # pragma: allowlist secret -- credencial fija del stack local
      # Sin GITLAB_*: mitigation.py falla su llamada HTTP con
      # RuntimeError, la captura, la registra como "failed" en
      # monitoring.mitigation_events y sigue -- exactamente el
      # comportamiento correcto para probar detección de drift local sin
      # disparar un pipeline de GitLab real.
    depends_on:
      mlflow:
        condition: service_healthy
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  # Entrenamiento local (Fase E) -- corre en Linux, igual que el job
  # "train_model" de CI (.gitlab-ci.yml), para que MLflow persista rutas de
  # artefacto con "/" en vez del separador nativo del host (ver
  # core_ml/train.Dockerfile). No arranca con "make up"/"docker compose up"
  # (profile "tools", excluido por defecto) -- se invoca puntualmente con
  # "docker compose run --rm trainer ..." (ver Makefile::train-toy/quality-gate).
  trainer:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: core_ml/train.Dockerfile
    volumes:
      - ./core_ml:/workspace
      # "pip install -r requirements.txt" corre en cada `docker compose run`
      # (ver train-entrypoint.sh) -- cachear aquí evita re-descargar ~2GB de
      # wheels (torch, cuda) en cada invocación; solo la primera corrida es
      # lenta.
      - trainer_pip_cache:/root/.cache/pip
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test  # pragma: allowlist secret -- credencial fija de LocalStack, nunca se usa fuera del stack local
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_ENDPOINT_URL: http://localstack:4566
      # scripts/sensor_simulator.py corre puntualmente en este mismo
      # contenedor (`docker compose run --rm trainer python -m
      # scripts.sensor_simulator ...`, ver Makefile::stream-local) --
      # necesita las mismas dos variables que stream-consumer para hablarle
      # a Kinesis vía LocalStack.
      AWS_ENDPOINT_URL: http://localstack:4566
      SENSOR_STREAM_NAME: sensor-telemetry-local
    depends_on:
      mlflow:
        condition: service_healthy

volumes:
  pgdata:
  localstack_data:
  trainer_pip_cache:
