# ==============================================================================
# Entorno local: replica lo esencial de AWS sin costo ni credenciales reales.
# LocalStack simula S3 (artefactos de modelo + datos de DVC), Postgres simula
# RDS, y MLflow + la API corren igual que en producción.
# ==============================================================================

services:
  # Base de datos local (Simula AWS RDS Postgres)
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: mlflow_db
      POSTGRES_USER: mlopsadmin
      POSTGRES_PASSWORD: localpassword123  # pragma: allowlist secret -- credencial fija solo para el stack local, nunca se usa fuera de docker-compose
    ports:
      - "5432:5432"
    # Desde Postgres 18, la imagen oficial espera el volumen montado en
    # /var/lib/postgresql (no en .../data).
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlopsadmin -d mlflow_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  # "La falsa nube": simula S3 (artefactos de modelo + datos de DVC) en un
  # único contenedor. La app le apunta a esto en vez de a AWS real -- mismo
  # API, cero costo, cero riesgo.
  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test  # pragma: allowlist secret -- credencial fija de LocalStack, nunca se usa fuera del stack local
      PERSISTENCE: 1
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      # Crea el bucket S3 automáticamente cuando LocalStack está listo --
      # ver localstack/init/.
      - ./localstack/init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 25

  # Servidor de tracking. Imagen oficial de MLflow -- sin driver de Postgres
  # de fábrica, así que el comando lo instala antes de levantar el server
  # (mismo patrón que kubernetes/base/mlflow.yaml en producción).
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    command: >
      sh -c "pip install --no-cache-dir psycopg2-binary==2.9.9 &&
      exec mlflow server --backend-store-uri postgresql://mlopsadmin:localpassword123@postgres/mlflow_db --default-artifact-root s3://mlops-portafolio-proj3-models/mlflow --host 0.0.0.0"  # pragma: allowlist secret -- credencial fija solo para el stack local
    ports:
      - "5000:5000"
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test  # pragma: allowlist secret -- credencial fija de LocalStack, nunca se usa fuera del stack local
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_ENDPOINT_URL: http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000')"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 15s

  # API Inferencia Local (Tu contenedor de FastAPI)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # El modelo se resuelve por nombre+alias contra el MLflow Model
      # Registry (ver api/main.py), no contra un bucket/ruta S3 fija.
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: dlinear-ett-forecaster
      MODEL_ALIAS: production
      # MLflow descarga el artefacto del modelo desde LocalStack (backend S3
      # del tracking server) usando estas credenciales.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test  # pragma: allowlist secret -- credencial fija de LocalStack, nunca se usa fuera del stack local
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_ENDPOINT_URL: http://localstack:4566
    depends_on:
      mlflow:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 20s

  # Entrenamiento local -- corre en Linux, igual que el job "train_model" de
  # CI (.gitlab-ci.yml), para que MLflow persista rutas de artefacto con "/"
  # en vez del separador nativo del host (ver core_ml/train.Dockerfile). No
  # arranca con "docker compose up" (profile "tools") -- se invoca
  # puntualmente con "docker compose run --rm trainer ..." (ver
  # Makefile::train/train-toy/quality-gate).
  trainer:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: core_ml/train.Dockerfile
    volumes:
      - ./core_ml:/workspace
      # "pip install -r requirements.txt" corre en cada `docker compose run`
      # (ver train-entrypoint.sh) -- cachear aquí evita re-descargar ~2GB de
      # wheels (torch, cuda) en cada invocación; solo la primera corrida es
      # lenta.
      - trainer_pip_cache:/root/.cache/pip
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test  # pragma: allowlist secret -- credencial fija de LocalStack, nunca se usa fuera del stack local
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_ENDPOINT_URL: http://localstack:4566
    depends_on:
      mlflow:
        condition: service_healthy

volumes:
  pgdata:
  localstack_data:
  trainer_pip_cache:
