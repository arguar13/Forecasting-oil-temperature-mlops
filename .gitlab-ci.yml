# .gitlab-ci.yml
#
# Pipeline simple, 4 etapas: valida -> construye y publica la imagen ->
# despliega. Entrenar es un job manual aparte, no corre en cada push.
#
# Variable de proyecto/grupo requerida en GitLab (Settings > CI/CD > Variables):
#   AWS_ACCOUNT_ID
#
# Runners: sin `tags:` -- corre en cualquier runner disponible del
# proyecto/grupo, compartido o propio.

variables:
  AWS_REGION: "us-east-1"
  ECR_REPOSITORY: "dlinear-forecast-api"
  EKS_CLUSTER_NAME: "dlinear-forecast-cluster-eks"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/poetry"
  # MLflow (kubernetes/base/mlflow.yaml) es un Service ClusterIP -- solo
  # resoluble DENTRO del cluster. Ver la nota en el job "train" de más abajo.
  MLFLOW_TRACKING_URI: "http://mlflow.dlinear-production.svc.cluster.local:5000"

stages:
  - lint_test
  - build_push
  - deploy
  - train

# Autenticación OIDC contra AWS -- credenciales temporales vía
# GitLabCI_OIDC_Role (ver terraform/iam.tf), sin guardar un access key de
# larga duración como variable de CI.
.aws-auth:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - |
      if ! command -v aws >/dev/null 2>&1; then
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache aws-cli >/dev/null
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq && apt-get install -y -qq awscli >/dev/null
        fi
      fi
    - >
      STS_OUTPUT=$(aws sts assume-role-with-web-identity
      --role-arn arn:aws:iam::${AWS_ACCOUNT_ID}:role/GitLabCI_OIDC_Role
      --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}"
      --web-identity-token ${GITLAB_OIDC_TOKEN}
      --duration-seconds 3600
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
      --output text)
    - export AWS_ACCESS_KEY_ID=$(echo "$STS_OUTPUT" | awk '{print $1}')
    - export AWS_SECRET_ACCESS_KEY=$(echo "$STS_OUTPUT" | awk '{print $2}')
    - export AWS_SESSION_TOKEN=$(echo "$STS_OUTPUT" | awk '{print $3}')

# ========================
# Lint + tests unitarios (api/ y core_ml/) -- el mismo `make lint`/`make test`
# que corre en local antes de hacer push.
# ========================
lint_test:
  stage: lint_test
  image: python:3.10
  cache:
    key: "poetry-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
      - .cache/poetry
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends make
    - pip install --no-cache-dir poetry==1.8.3
  script:
    - make install
    - make lint
    - make test
  rules:
    - if: $CI_COMMIT_BRANCH

# ========================
# Build & push de la imagen de la API a ECR (sirve tanto el endpoint HTTP
# como el CronJob de batch inference).
# ========================
build_push:
  stage: build_push
  extends: .aws-auth
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - apk add --no-cache aws-cli
    # El servicio dind a veces todavía no acepta conexiones cuando arranca
    # este script -- reintenta en vez de asumir que ya está listo.
    - i=0; until docker info >/dev/null 2>&1 || [ $i -ge 30 ]; do i=$((i+1)); sleep 2; done
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
    - ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
    - docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$CI_COMMIT_SHA -f Dockerfile .
    - docker push $ECR_REGISTRY/$ECR_REPOSITORY:$CI_COMMIT_SHA
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ========================
# Deploy directo vía kubectl: este job actualiza el tag de imagen con
# kustomize y aplica los manifiestos al cluster. alpine/k8s ya trae
# kubectl + aws-cli + kustomize preinstalados.
# ========================
deploy:
  stage: deploy
  extends: .aws-auth
  image: alpine/k8s:1.30.13
  needs: ["build_push"]
  script:
    - aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_REGION
    - cd kubernetes/overlays/production
    - kustomize edit set image dlinear-api=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/$ECR_REPOSITORY:$CI_COMMIT_SHA
    - kubectl apply -k .
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ========================
# Entrenamiento manual: entrena, evalúa el quality gate (compara contra la
# versión actual de "production" en el Model Registry) y promueve si el
# candidato es mejor. No corre automáticamente en cada push -- se dispara a
# mano desde la UI de GitLab cuando hay datos nuevos.
#
# Nota/limitación conocida: MLFLOW_TRACKING_URI apunta al Service interno de
# MLflow, solo resoluble DENTRO de la VPC del cluster. Los runners
# compartidos de GitLab.com no tienen esa conectividad -- para correr este
# job tal cual necesitás un runner con acceso a la VPC (o exponer MLflow en
# un endpoint alcanzable). Para desarrollo y pruebas, `make train` corre el
# mismo pipeline en local contra el MLflow de docker-compose.
# ========================
train:
  stage: train
  extends: .aws-auth
  image: python:3.10
  before_script:
    - !reference [.aws-auth, before_script]
    - pip install --no-cache-dir poetry==1.8.3
  script:
    - cd core_ml && poetry install --sync --no-interaction
    - poetry run dvc pull data/raw/ETTh1.csv.dvc
    - poetry run python -m src.data_processing --dataset raw
    - poetry run python -m src.train --dataset raw
    - poetry run python -m src.quality_gate
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
