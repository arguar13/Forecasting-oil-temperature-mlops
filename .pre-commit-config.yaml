# Validación básica antes de cada commit: higiene de archivos, formato/lint
# de Python (ruff) y las pruebas unitarias de cada subproyecto.
#
# Instalación local:
#   pip install pre-commit  (o: pipx install pre-commit)
#   make hooks
#
# En un entorno real de producción normalmente se agregarían además: un
# scanner de secretos (detect-secrets), un linter de YAML (yamllint) y un
# escaneo de vulnerabilidades de dependencias/imágenes (trivy o similar).
# Se omiten aquí a propósito para mantener el pipeline simple mientras se
# aprende -- son piezas que sumar más adelante, no una necesidad para que
# el proyecto funcione.

repos:
  # ---------------------------------------------------------
  # Higiene general de archivos + validación de YAML/TOML/JSON
  # ---------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents", "--unsafe"]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict

  # ---------------------------------------------------------
  # Python: lint + formateo (Ruff reemplaza black/isort/flake8)
  # ---------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  # ---------------------------------------------------------
  # Python: type checking (mypy), liviano y opcional -- usa el venv real de
  # Poetry de cada subproyecto.
  # ---------------------------------------------------------
  - repo: local
    hooks:
      - id: mypy-api
        name: mypy (api)
        entry: bash -c 'cd api && poetry run mypy .'
        language: system
        files: ^api/.*\.py$
        pass_filenames: false

      - id: mypy-core-ml
        name: mypy (core_ml)
        entry: bash -c 'cd core_ml && poetry run mypy .'
        language: system
        files: ^core_ml/.*\.py$
        pass_filenames: false

      # -------------------------------------------------------
      # Python: pruebas unitarias (pytest)
      # -------------------------------------------------------
      - id: pytest-api
        name: pytest (api)
        entry: bash -c 'cd api && poetry run pytest'
        language: system
        files: ^api/.*\.py$
        pass_filenames: false

      - id: pytest-core-ml
        name: pytest (core_ml)
        entry: bash -c 'cd core_ml && poetry run pytest'
        language: system
        files: ^core_ml/.*\.py$
        pass_filenames: false

      # -------------------------------------------------------
      # Infra: valida sintaxis de Terraform (fmt -check) si se toca IaC
      # -------------------------------------------------------
      - id: terraform-fmt-check
        name: terraform fmt -check
        # if/else, no `A && B || C`: con esa forma, un `fmt -check` que falla
        # también caía en el `|| echo` y el hook salía con 0 -- nunca bloqueaba.
        entry: bash -c 'if command -v terraform >/dev/null 2>&1; then terraform -chdir=terraform fmt -check -recursive; else echo "terraform no instalado localmente, omitiendo"; fi'
        language: system
        files: ^terraform/.*\.tf$
        pass_filenames: false
